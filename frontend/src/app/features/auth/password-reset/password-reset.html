<div class="contenedor-principal">
  <div class="tarjeta-principal">
    <div class="encabezado-login">
      <h1 class="titulo">Recuperar Contraseña</h1>
      <p class="subtitulo">Portal de Distribución B2B</p>
    </div>

    @if (currentStep === 1) {
      <form (ngSubmit)="onVerifyEmail()" class="formulario-login">
        <div class="grupo-formulario">
          <label for="email" class="etiqueta">Correo Electrónico</label>
          <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="admin@empresa.com" class="input-texto">
        </div>
        @if (errorMessage) { <p class="mensaje-error">{{ errorMessage }}</p> }
        <button type="submit" class="btn-primario" [disabled]="isLoading">
          <span *ngIf="!isLoading">Verificar Correo</span>
          <span *ngIf="isLoading" class="spinner"></span>
        </button>
      </form>
    }

    @if (currentStep === 2) {
      <form (ngSubmit)="onResetPassword()" class="formulario-login">
        <div class="grupo-formulario">
          <label class="etiqueta">Correo</label>
          <input type="email" [value]="email" disabled class="input-texto" style="opacity: 0.6;">
        </div>
        <div class="grupo-formulario">
          <label for="newPassword" class="etiqueta">Nueva Contraseña</label>
          <input type="password" id="newPassword" name="newPassword" [(ngModel)]="newPassword" required placeholder="••••••••" class="input-texto">
        </div>
        <div class="grupo-formulario">
          <label for="confirmPassword" class="etiqueta">Confirmar Contraseña</label>
          <input type="password" id="confirmPassword" name="confirmPassword" [(ngModel)]="confirmPassword" required placeholder="••••••••" class="input-texto">
        </div>
        @if (errorMessage) { <p class="mensaje-error">{{ errorMessage }}</p> }
        @if (successMessage) { <p class="mensaje-error" style="background-color: #f0fdf4; color: #16a34a; border-color: #bbf7d0;">{{ successMessage }}</p> }
        <button type="submit" class="btn-primario" [disabled]="isLoading">
          <span *ngIf="!isLoading">Guardar Contraseña</span>
          <span *ngIf="isLoading" class="spinner"></span>
        </button>
      </form>
    }

    <div style="text-align: center; margin-top: 1.5rem;">
      <a routerLink="/login" class="enlace-olvido" style="font-size: 0.875rem;">Volver al inicio de sesión</a>
    </div>
  </div>
</div>
