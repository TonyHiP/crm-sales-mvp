<header class="cabecera-sistema">
  <div class="seccion-izquierda">
    <button id="mobile-menu-btn" class="boton-menu-movil">
      <svg class="icono-menu" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
    </button>
    <div class="ruta-navegacion">
      Portal de Distribución B2B <span class="separador">/</span> <span class="pagina-actual">Dashboard</span>
    </div>
  </div>
  <button class="boton-logout" (click)="cambiarEstadoModal(true)">
    <svg class="icono-logout" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
    </svg>
    Cerrar Sesión
  </button>
</header>

@if (mostrarModalLogout) {
  <div class="modal-overlay">
    <div class="modal-alerta">
      <div class="modal-icono">⚠️</div>
      <h2>¿Cerrar Sesión?</h2>
      <p>¿Estás seguro de que deseas salir del Portal B2B? Se perderán los cambios no guardados.</p>
      <div class="modal-botones">
        <button (click)="cambiarEstadoModal(false)" class="btn-cancelar">Cancelar</button>
        <button (click)="confirmarLogout()" class="btn-confirmar">Sí, cerrar sesión</button>
      </div>
    </div>
  </div>
}
