<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - CRM Sales MVP</title>
    <script>
        if (localStorage.getItem('crm_user_logged')) {
            window.location.replace('index.html');
        }
    </script>
        <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#6366f1',
                        sidebar: '#0f172a',
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased bg-gray-100 flex items-center justify-center min-h-screen p-4">
        <div class="bg-white rounded-3xl shadow-xl border border-slate-100 w-full max-w-md p-8 md:p-10 transform transition-all">
                <div class="flex flex-col items-center justify-center mb-8">
            <div class="bg-indigo-50 p-3 rounded-full mb-4">
                <svg class="w-10 h-10 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Crear una cuenta</h1>
            <p class="text-sm text-slate-500 mt-2 text-center">Ingresa los datos para registrar un nuevo usuario</p>
        </div>
                <form id="registerForm" class="space-y-6">
                        <div>
                <label for="name" class="block text-sm font-medium text-slate-700 mb-1">Nombre Completo</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    </div>
                    <input type="text" id="name" required placeholder="Juan Pérez" class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-shadow text-slate-900 bg-slate-50 focus:bg-white">
                </div>
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>
                    </div>
                    <input type="email" id="email" required placeholder="admin@empresa.com" class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-shadow text-slate-900 bg-slate-50 focus:bg-white">
                </div>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </div>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-shadow text-slate-900 bg-slate-50 focus:bg-white">
                </div>
            </div>
            <div>
                <label for="rol" class="block text-sm font-medium text-slate-700 mb-1">Rol del Usuario</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                    </div>
                    <select id="rol" required class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-shadow text-slate-900 bg-slate-50 focus:bg-white appearance-none">
                        <option value="" disabled selected>Selecciona un rol</option>
                        <option value="1">Administrador</option>
                        <option value="2">Asesor</option>
                    </select>
                    <div class="absolute inset-y-0 right-0 pr-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>
            </div>
                        <button type="submit" class="w-full bg-brand hover:bg-indigo-600 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-indigo-200 transition-all active:scale-[0.98] flex justify-center items-center group">
                <span>Registrar Usuario</span>
                <svg class="w-5 h-5 ml-2 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>
        <div class="mt-6 text-center">
            <a href="login.html" class="text-sm font-medium text-slate-500 hover:text-brand transition-colors">¿Ya tienes una cuenta? Inicia sesión aquí</a>
        </div>
    </div>
        <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
                        const btn = this.querySelector('button[type="submit"]');
            const originalBtnContent = btn.innerHTML;
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rol_id = document.getElementById('rol').value;
            // Limpiar mensajes previos
            const existingMsg = document.getElementById('register-msg');
            if (existingMsg) existingMsg.remove();
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            try {
                // 🛡️ Filtro de seguridad (Anti-SQL Injection) Frontend
                const sqlPattern = /('|"|;|--|\/\*|\*\/|\b(SELECT|UNION|INSERT|DELETE|UPDATE|DROP|ALTER|EXEC)\b)/i;
                if (sqlPattern.test(name) || sqlPattern.test(email) || sqlPattern.test(password)) {
                    throw new Error('Ese tipo de caracteres no son válidos por seguridad.');
                }
                const response = await fetch('http://localhost:8080/v1/register.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, rol_id })
                });
                const data = await response.json();
                if (response.ok && data.status === 'success') {
                    // Mostrar mensaje de éxito
                    const successMsg = document.createElement('p');
                    successMsg.id = 'register-msg';
                    successMsg.className = 'text-emerald-600 text-sm text-center font-medium bg-emerald-50 p-3 rounded-xl mb-4 border border-emerald-100';
                    successMsg.textContent = data.message;
                    this.insertBefore(successMsg, btn);
                                        // Resetear el formulario
                    this.reset();
                                        setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    throw new Error(data.message || 'Error al registrar el usuario');
                }
            } catch (error) {
                // Pintar el error dinámicamente encima del botón
                const errorMsg = document.createElement('p');
                errorMsg.id = 'register-msg';
                errorMsg.className = 'text-red-500 text-sm text-center font-medium bg-red-50 p-3 rounded-xl mb-4 border border-red-100';
                errorMsg.textContent = error.message;
                this.insertBefore(errorMsg, btn);
            } finally {
                if(!document.querySelector('#register-msg.text-emerald-600')){
                    // Restaurar estado del botón solo si hubo error (si es éxito, dejamos el spinner hasta redirigir o deshabilitamos)
                    btn.innerHTML = originalBtnContent;
                    btn.disabled = false;
                    btn.classList.remove('opacity-80', 'cursor-not-allowed');
                } else {
                     btn.innerHTML = `<span>Redirigiendo...</span>`;
                }
            }
        });
    </script>
</body>
</html>
