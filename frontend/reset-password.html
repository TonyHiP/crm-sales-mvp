<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Contraseña - CRM Sales MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#6366f1',
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 w-full max-w-md p-8 md:p-10 transform transition-all">
        <div class="flex flex-col items-center justify-center mb-8">
            <div class="bg-indigo-50 p-3 rounded-full mb-4">
                <svg class="w-10 h-10 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Nueva Contraseña</h1>
            <p class="text-sm text-slate-500 mt-2 text-center">Ingresa tu nueva contraseña para acceder</p>
        </div>
        <div id="invalidToken" class="hidden bg-red-50 p-4 rounded-xl border border-red-100 mb-6">
            <p class="text-red-600 text-sm font-medium text-center">El enlace de recuperación es inválido o ha expirado.</p>
        </div>
        <form id="resetForm" class="space-y-6">
            <div>
                <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Nueva Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </div>
                    <input type="password" id="password" required placeholder="••••••••" class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-shadow text-slate-900 bg-slate-50 focus:bg-white">
                </div>
            </div>
            <div>
                <label for="confirm_password" class="block text-sm font-medium text-slate-700 mb-1">Confirmar Contraseña</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </div>
                    <input type="password" id="confirm_password" required placeholder="••••••••" class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-shadow text-slate-900 bg-slate-50 focus:bg-white">
                </div>
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-brand hover:bg-indigo-600 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-indigo-200 transition-all active:scale-[0.98] flex justify-center items-center group">
                <span>Guardar Contraseña</span>
                <svg class="w-5 h-5 ml-2 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            </button>
        </form>
        <div class="mt-6 text-center">
            <a href="login.html" class="text-sm font-medium text-slate-500 hover:text-brand transition-colors">Volver al inicio de sesión</a>
        </div>
    </div>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        if (!token) {
            document.getElementById('resetForm').classList.add('hidden');
            document.getElementById('invalidToken').classList.remove('hidden');
        }
        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
                        const btn = document.getElementById('submitBtn');
            const originalBtnContent = btn.innerHTML;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            // Limpiar errores previos
            const existingMsg = document.getElementById('reset-msg');
            if (existingMsg) existingMsg.remove();
            if (password !== confirm_password) {
                showMsg('Las contraseñas no coinciden', 'error');
                return;
            }
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            try {
                // 🛡️ Filtro de seguridad (Anti-SQL Injection) Frontend
                const sqlPattern = /('|"|;|--|\/\*|\*\/|\b(SELECT|UNION|INSERT|DELETE|UPDATE|DROP|ALTER|EXEC)\b)/i;
                if (sqlPattern.test(password)) {
                    throw new Error('Ese tipo de caracteres no son válidos por seguridad.');
                }
                const response = await fetch('http://localhost:8080/v1/reset-password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const data = await response.json();
                if (response.ok && data.status === 'success') {
                    showMsg(data.message, 'success');
                    this.reset();
                    btn.innerHTML = `<span>Redirigiendo...</span>`;
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                } else {
                    throw new Error(data.message || 'Error al restablecer la contraseña');
                }
            } catch (error) {
                showMsg(error.message, 'error');
                btn.innerHTML = originalBtnContent;
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        });
        function showMsg(msg, type) {
            const form = document.getElementById('resetForm');
            const msgEl = document.createElement('p');
            msgEl.id = 'reset-msg';
            if (type === 'error') {
                msgEl.className = 'text-red-500 text-sm text-center font-medium bg-red-50 p-3 rounded-xl mb-4 border border-red-100';
            } else {
                msgEl.className = 'text-emerald-600 text-sm text-center font-medium bg-emerald-50 p-3 rounded-xl mb-4 border border-emerald-100';
            }
            msgEl.textContent = msg;
            form.insertBefore(msgEl, document.getElementById('submitBtn'));
        }
    </script>
</body>
</html>
