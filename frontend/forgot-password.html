<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - CRM Sales MVP</title>
    <script>
        if (localStorage.getItem('crm_user_logged')) {
            window.location.replace('index.html');
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#6366f1',
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 w-full max-w-md p-8 md:p-10 transform transition-all">
        <div class="flex flex-col items-center justify-center mb-8">
            <div class="bg-indigo-50 p-3 rounded-full mb-4">
                <svg class="w-10 h-10 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Recuperar Contraseña</h1>
            <p id="step-description" class="text-sm text-slate-500 mt-2 text-center">Ingresa tu correo para verificar si está registrado.</p>
        </div>

        <form id="resetForm" class="space-y-6">
            <div id="alert-container"></div>
            
            <!-- Paso 1: Correo -->
            <div id="step-1">
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>
                    </div>
                    <input type="email" id="email" required placeholder="admin@empresa.com" class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-shadow text-slate-900 bg-slate-50 focus:bg-white">
                </div>
            </div>

            <!-- Paso 2: Nuevas Contraseñas (Oculto inicialmente) -->
            <div id="step-2" class="hidden space-y-6">
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 mb-1">Nueva Contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </div>
                        <input type="password" id="password" placeholder="••••••••" minlength="6" class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-shadow text-slate-900 bg-slate-50 focus:bg-white">
                    </div>
                </div>

                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-slate-700 mb-1">Confirmar nueva contraseña</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </div>
                        <input type="password" id="confirm_password" placeholder="••••••••" minlength="6" class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-shadow text-slate-900 bg-slate-50 focus:bg-white">
                    </div>
                </div>
            </div>

            <button type="submit" id="main-btn" class="w-full bg-brand hover:bg-indigo-600 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-indigo-200 transition-all active:scale-[0.98] flex justify-center items-center group">
                <span id="btn-text">Verificar Correo</span>
                <svg class="w-5 h-5 ml-2 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
            
            <div class="text-center mt-6">
                <a href="login.html" class="text-sm font-medium text-slate-500 hover:text-brand transition-colors">Volver al inicio de sesión</a>
            </div>
        </form>
    </div>

    <script>
        let currentStep = 1;

        document.getElementById('resetForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('main-btn');
            const btnText = document.getElementById('btn-text');
            const originalBtnContent = btn.innerHTML;
            const alertContainer = document.getElementById('alert-container');
            
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirm_password');
            
            alertContainer.innerHTML = '';
            
            // Función auxiliar para mostrar alertas
            const showAlert = (message, type) => {
                if (type === 'error') {
                    alertContainer.innerHTML = `
                        <div class="bg-red-50 border border-red-200 text-red-600 px-4 py-3 rounded-xl text-sm text-center font-medium mb-4">
                            ${message}
                        </div>
                    `;
                } else {
                    alertContainer.innerHTML = `
                        <div class="bg-emerald-50 border border-emerald-200 text-emerald-600 px-4 py-3 rounded-xl text-sm text-center font-medium mb-4">
                            ${message}
                        </div>
                    `;
                }
            };

            const setLoading = (isLoading) => {
                if (isLoading) {
                    btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
                    btn.disabled = true;
                    btn.classList.add('opacity-80', 'cursor-not-allowed');
                } else {
                    btn.innerHTML = originalBtnContent;
                    btn.disabled = false;
                    btn.classList.remove('opacity-80', 'cursor-not-allowed');
                    if(currentStep === 2) {
                        document.getElementById('btn-text').textContent = 'Cambiar Contraseña';
                    }
                }
            };

            try {
                const sqlPattern = /('|"|;|--)/i;
                
                // PASO 1: Verificar Correo
                if (currentStep === 1) {
                    const email = emailInput.value.trim();
                    if (sqlPattern.test(email)) {
                        throw new Error('El formato del correo es inválido o contiene caracteres prohibidos.');
                    }

                    setLoading(true);

                    const response = await fetch('http://localhost:8080/v1/check-email.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || 'Error al verificar el correo.');
                    }

                    // Éxito: el correo existe. Pasamos al paso 2.
                    currentStep = 2;
                    emailInput.readOnly = true;
                    emailInput.classList.add('bg-slate-100', 'text-slate-500'); // Deshabilitar visualmente
                    
                    document.getElementById('step-description').textContent = 'Ingresa y confirma tu nueva contraseña.';
                    document.getElementById('step-2').classList.remove('hidden');
                    passwordInput.required = true;
                    confirmPasswordInput.required = true;
                    
                    setLoading(false);
                } 
                // PASO 2: Cambiar Contraseña
                else if (currentStep === 2) {
                    const email = emailInput.value.trim();
                    const password = passwordInput.value.trim();
                    const confirmPassword = confirmPasswordInput.value.trim();

                    if (password !== confirmPassword) {
                        throw new Error('Las contraseñas no coinciden.');
                    }

                    if (sqlPattern.test(password)) {
                        throw new Error('La contraseña contiene caracteres prohibidos por seguridad.');
                    }

                    setLoading(true);

                    const response = await fetch('http://localhost:8080/v1/reset-password.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.message || 'Error al cambiar la contraseña.');
                    }

                    showAlert('¡Contraseña actualizada con éxito! Ya puedes iniciar sesión.', 'success');
                    
                    // Bloquear formulario
                    passwordInput.disabled = true;
                    confirmPasswordInput.disabled = true;
                    btn.style.display = 'none';
                }

            } catch (error) {
                showAlert(error.message, 'error');
                setLoading(false);
            }
        });
    </script>
</body>
</html>
