<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - CRM Sales MVP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: '#6366f1',
                    }
                }
            }
        }
    </script>
</head>
<body class="antialiased bg-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white rounded-3xl shadow-xl border border-slate-100 w-full max-w-md p-8 md:p-10 transform transition-all">
        <div class="flex flex-col items-center justify-center mb-8">
            <div class="bg-indigo-50 p-3 rounded-full mb-4">
                <svg class="w-10 h-10 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-900 tracking-tight">Recuperar Contraseña</h1>
            <p class="text-sm text-slate-500 mt-2 text-center">Ingresa tu correo para recibir un enlace de recuperación</p>
        </div>
        <form id="forgotForm" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-slate-700 mb-1">Correo Electrónico</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>
                    </div>
                    <input type="email" id="email" required placeholder="admin@empresa.com" class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-shadow text-slate-900 bg-slate-50 focus:bg-white">
                </div>
            </div>
            <button type="submit" class="w-full bg-brand hover:bg-indigo-600 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-indigo-200 transition-all active:scale-[0.98] flex justify-center items-center group">
                <span>Enviar Enlace</span>
                <svg class="w-5 h-5 ml-2 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </form>
        <div id="resultContainer" class="hidden mt-6"></div>
        <div class="mt-6 text-center">
            <a href="login.html" class="text-sm font-medium text-slate-500 hover:text-brand transition-colors">Volver al inicio de sesión</a>
        </div>
    </div>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async function(e) {
            e.preventDefault();
                        const btn = this.querySelector('button[type="submit"]');
            const originalBtnContent = btn.innerHTML;
            const email = document.getElementById('email').value;
            const resultContainer = document.getElementById('resultContainer');
            resultContainer.innerHTML = '';
            resultContainer.classList.add('hidden');
            btn.innerHTML = `<svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>`;
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            try {
                // 🛡️ Filtro de seguridad (Anti-SQL Injection) Frontend
                const sqlPattern = /('|"|;|--|\/\*|\*\/|\b(SELECT|UNION|INSERT|DELETE|UPDATE|DROP|ALTER|EXEC)\b)/i;
                if (sqlPattern.test(email)) {
                    throw new Error('Ese tipo de caracteres no son válidos por seguridad.');
                }
                const response = await fetch('http://localhost:8080/v1/forgot-password.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();
                if (response.ok && data.status === 'success') {
                    this.reset();
                    resultContainer.classList.remove('hidden');
                                        // Mostramos el token simulando el envío del correo (sólo para desarrollo/MVP)
                    if (data.token) {
                        resultContainer.innerHTML = `
                            <div class="bg-emerald-50 border border-emerald-100 p-4 rounded-xl">
                                <p class="text-emerald-700 text-sm font-medium text-center mb-2">${data.message}</p>
                                <p class="text-xs text-slate-500 text-center mb-2 mt-4 font-bold">SIMULACIÓN DE CORREO (Desarrollo):</p>
                                <a href="reset-password.html?token=${data.token}" class="block text-center text-brand font-bold break-all hover:underline text-sm">
                                    Clic aquí para restablecer (Token adjunto)
                                </a>
                            </div>
                        `;
                    } else {
                        resultContainer.innerHTML = `<p class="text-emerald-700 text-sm font-medium text-center bg-emerald-50 p-3 rounded-xl border border-emerald-100">${data.message}</p>`;
                    }
                } else {
                    throw new Error(data.message || 'Error al procesar la solicitud');
                }
            } catch (error) {
                resultContainer.classList.remove('hidden');
                resultContainer.innerHTML = `<p class="text-red-500 text-sm text-center font-medium bg-red-50 p-3 rounded-xl border border-red-100">${error.message}</p>`;
            } finally {
                btn.innerHTML = originalBtnContent;
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
